app = "carecash"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  # Sign-in and links use SITE_URL (a secret, https://carecash.me) when set; this is the fallback
  BETTER_AUTH_URL = "https://carecash.fly.dev"

# SQLite database and receipt photos live on this volume
[mounts]
  source = "carecash_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/manifest.webmanifest"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

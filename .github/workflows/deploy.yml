name: Deploy

# Deploys to Fly.io on every push to main (and by hand from Actions → Deploy → Run workflow).
# Needs the repository secret FLY_API_TOKEN (`flyctl tokens create deploy -a carecash`); skipped without it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check for the Fly token
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "FLY_API_TOKEN is not set; skipping deploy."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
        if: steps.token.outputs.ok == 'true'
      # One machine only: SQLite lives on a single volume
      - run: flyctl deploy --remote-only --ha=false -a carecash
        if: steps.token.outputs.ok == 'true'
